name: farta
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    security_opt: ["no-new-privileges:true"]
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      FARTA_API_URL: http://api:3001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Required}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Required}
      NEXT_PUBLIC_SITE_URL: https://farta.site
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      NODE_OPTIONS: --max-old-space-size=512
    networks: [edge, application]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an immutable image reference}
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Required}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Required}
      NODE_OPTIONS: --max-old-space-size=256
    networks: [application, outbound]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
networks:
  edge:
  application:
    internal: true
  outbound:
volumes:
  caddy_data:
  caddy_config:
