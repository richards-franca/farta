name: Isolated Supabase integration
on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start an isolated Supabase with repository migrations
        run: |
          # Historical demo migrations reference the original seed company.
          # Only this disposable checkout receives the prerequisite fixture.
          cp supabase/tests/demo-prerequisites.sql supabase/migrations/20260929000400_ci_demo_prerequisites.sql
          supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Test against real Auth and PostgreSQL
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase-test.env"
          set -a
          source "$RUNNER_TEMP/supabase-test.env"
          set +a
          FARTA_TEST_SUPABASE_URL="$API_URL" FARTA_TEST_ANON_KEY="$ANON_KEY" FARTA_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY" npm run test:integration --workspace @farta/api
      - name: Build web and test the real customer and banner interfaces
        run: |
          set -a
          source "$RUNNER_TEMP/supabase-test.env"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false FARTA_API_URL=http://127.0.0.1:3001
          npm run build
          npx playwright install --with-deps chromium
          FARTA_TEST_SUPABASE_URL="$API_URL" FARTA_TEST_ANON_KEY="$ANON_KEY" FARTA_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY" node scripts/ui-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-ui-qa
          path: test-results/customer-ui/
          retention-days: 14
      - if: always()
        run: supabase stop --no-backup
