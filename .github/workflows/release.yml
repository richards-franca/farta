name: Build and deploy VPS
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to deploy
        required: true
permissions:
  contents: read
concurrency:
  group: farta-production
  cancel-in-progress: false
jobs:
  integration:
    uses: ./.github/workflows/integration.yml
    with:
      revision: ${{ inputs.revision }}
  build:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.web.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
    steps:
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://farta.site
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
          FARTA_API_URL: http://api:3001
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ghcr.io/richards-franca/farta-web:${{ inputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://farta.site
            NEXT_DEPLOYMENT_ID=${{ inputs.revision }}
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ghcr.io/richards-franca/farta-api:${{ inputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.FARTA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.FARTA_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/farta
          chmod 600 ~/.ssh/farta
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Authorize registry pull for this deployment
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/farta -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22022 farta@143.95.174.202 "registry-login $REGISTRY_USER"
      - name: Deploy immutable release
        env:
          WEB: ghcr.io/richards-franca/farta-web@${{ needs.build.outputs.web }}
          API: ghcr.io/richards-franca/farta-api@${{ needs.build.outputs.api }}
          REVISION: ${{ inputs.revision }}
        run: ssh -i ~/.ssh/farta -o BatchMode=yes -o StrictHostKeyChecking=yes -p 22022 farta@143.95.174.202 "deploy $WEB $API $REVISION"
      - name: Check public HTTPS
        run: curl --fail --retry-all-errors --retry 8 --retry-delay 10 --connect-timeout 10 --max-time 20 https://farta.site/api/health
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Check public authentication redirects and assets
        run: node scripts/check-public.mjs
